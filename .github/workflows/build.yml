name: Build GUI exe

on:
  push:
    paths:
      - 'CleanGuoCacheGui.cs'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile GUI exe
        shell: powershell
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /optimize+ /target:winexe /utf8output /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /out:clean-guo-cache-gui.exe CleanGuoCacheGui.cs

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: clean-guo-cache-gui
          path: clean-guo-cache-gui.exe
